name: Keep Render Web Service Active

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier 15-minute inactivity spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service Healthcheck
        run: |
          echo "Pinging https://celpip-project.onrender.com/healthz..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://celpip-project.onrender.com/healthz")
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Render service is active and responsive."
          else
            echo "Healthcheck returned $HTTP_STATUS, pinging main app..."
            curl -s -f --max-time 60 "https://celpip-project.onrender.com/" > /dev/null
            echo "Main app ping completed."
          fi
