name: Content Sync & Crawler

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx fastapi uvicorn pydantic starlette pytest pytest-asyncio

      - name: Crawl Latest Sitemap Pages
        run: |
          python -m celtestpip.crawler.crawl_all_pages

      - name: Unlock Content & Strip Spinners
        run: |
          python -m celtestpip.scripts.unlock_all_pro_content

      - name: Run Verification Test Suite
        run: |
          pytest celtestpip/tests -v

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add celtestpip/data/pages/ celtestpip/static/
          if git diff --staged --quiet; then
            echo "No content updates detected."
          else
            git commit -m "chore(sync): automatically crawl latest content from celtestpip.com"
            git push origin main
          fi
